<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 2532" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#121212" />
  
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#121212" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="spottyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#15883e" />
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect width="100%" height="100%" fill="url(#bgGlow)" />

  <!-- Centered Logo Graphics -->
  <g transform="translate(585, 1140)">
    <!-- Vinyl Disc -->
    <circle cx="0" cy="0" r="140" fill="#181818" stroke="#282828" stroke-width="6" filter="url(#shadow)" />
    <circle cx="0" cy="0" r="115" stroke="#222222" stroke-width="4" stroke-dasharray="10 5" opacity="0.6" />
    <circle cx="0" cy="0" r="90" stroke="#252525" stroke-width="3" opacity="0.4" />
    
    <!-- Green Center Record Label -->
    <circle cx="0" cy="0" r="68" fill="url(#spottyGreen)" />
    <circle cx="0" cy="0" r="20" fill="#121212" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.9" />

    <!-- Wave lines -->
    <path d="M -60 0 A 60 60 0 0 1 60 0" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.9" />
    <path d="M -42 0 A 42 42 0 0 1 42 0" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.7" />
    <path d="M -24 0 A 24 24 0 0 1 24 0" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5" />
    
    <!-- App Name Title -->
    <text x="0" y="240" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Figtree', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5" text-anchor="middle">
      Spotty
    </text>
    
    <text x="0" y="285" fill="#B3B3B3" font-family="-apple-system, BlinkMacSystemFont, 'Figtree', sans-serif" font-size="20" font-weight="600" letter-spacing="4" text-anchor="middle">
      SOUNDCLOUD MUSIC
    </text>
  </g>
</svg>
