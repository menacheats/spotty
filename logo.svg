<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="spottyGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ED760" />
      <stop offset="100%" stop-color="#15883e" />
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1DB954" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Vinyl Rim -->
  <circle cx="60" cy="60" r="54" fill="#181818" stroke="#282828" stroke-width="2.5" filter="url(#shadow)" />
  
  <!-- Vinyl Grooves -->
  <circle cx="60" cy="60" r="44" stroke="#222222" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6" />
  <circle cx="60" cy="60" r="34" stroke="#252525" stroke-width="1.2" opacity="0.4" />
  
  <!-- Vibrant Sound Ring (Spotty Green) -->
  <circle cx="60" cy="60" r="26" fill="url(#spottyGreen)" />
  <circle cx="60" cy="60" r="26" fill="url(#glowG)" />

  <!-- Center Spindle Hole -->
  <circle cx="60" cy="60" r="8" fill="#121212" />
  <circle cx="60" cy="60" r="4" fill="#ffffff" opacity="0.9" />

  <!-- Dynamic Equalizer / Pulse Dots orbiting -->
  <path d="M 40 50 C 40 40, 52 32, 60 32" stroke="#1ED760" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 80 70 C 80 80, 68 88, 60 88" stroke="#1ED760" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Sound Waves -->
  <path d="M 34 60 A 26 26 0 0 1 86 60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M 42 60 A 18 18 0 0 1 78 60" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
  <path d="M 49 60 A 11 11 0 0 1 71 60" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.5" />
</svg>
